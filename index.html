<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>chapter - your love beautifully remembered</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Two videos side by side */
        .videos {
            position: fixed;
            inset: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .videos video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) brightness(0.28);
        }

        /* Thin divider between videos */
        .videos::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            left: 50%;
            width: 1px;
            background: rgba(255,255,255,0.06);
        }

        /* Overall dark wash */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.38);
        }

        /* Centered text */
        .content {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 10px;
            letter-spacing: 0.55em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            opacity: 0;
            animation: rise 1.2s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
        }

        .headline {
            font-family: 'Playfair Display', serif;
            font-size: clamp(30px, 4.5vw, 58px);
            font-weight: 100;
            font-style: italic;
            color: #ffffff;
            text-align: center;
            line-height: 1.25;
            letter-spacing: -3.5px;
            opacity: 0;
            animation: rise 1.8s cubic-bezier(0.16,1,0.3,1) 0.5s forwards;
        }

        .headline em {
            font-style: normal;
            letter-spacing: -3.5px;
            color: rgba(255,255,255,0.45);
        }

        .rule {
            width: 0;
            height: 1px;
            background: rgba(255,255,255,0.18);
            animation: expand 1.4s cubic-bezier(0.16,1,0.3,1) 1.1s forwards;
        }

        .note {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 13px;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.22);
            opacity: 0;
            animation: rise 1.2s cubic-bezier(0.16,1,0.3,1) 1.5s forwards;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes expand {
            to { width: 80px; }
        }
    </style>
</head>
<body>

<div class="videos">
    <video autoplay muted loop playsinline
           src="https://www.pexels.com/download/video/7767968/"></video>
    <video autoplay muted loop playsinline
           src="https://www.pexels.com/download/video/13010732/"></video>
</div>

<div class="overlay"></div>

<div class="content">
    <h1 class="headline">this chapter is being reimagined<br/><em>stay with us</em></h1>
    <div class="rule"></div>
</div>

</body>
</html>
